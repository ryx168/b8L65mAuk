name: D1 Database Restore

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'Backup filename to restore from, e.g. xotours-db_2026-08-22T09-00-00Z.sql (must exist in d1_backups/)'
        required: true
        type: string
      confirm:
        description: 'Type RESTORE to confirm this will overwrite the live production database'
        required: true
        type: string

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check confirmation phrase
        run: |
          if [ "${{ inputs.confirm }}" != "RESTORE" ]; then
            echo "Confirmation phrase did not match 'RESTORE'. Aborting."
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify backup file exists
        run: |
          if [ ! -f "d1_backups/${{ inputs.backup_file }}" ]; then
            echo "Backup file not found: d1_backups/${{ inputs.backup_file }}"
            exit 1
          fi

      - name: Safety pre-restore backup of current live state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p d1_backups
          TIMESTAMP=$(TZ='America/Los_Angeles' date +"%Y-%m-%dT%H-%M-%S_PT")
          npx wrangler d1 export xotours-db --remote --output="d1_backups/pre-restore-safety_${TIMESTAMP}.sql"

      - name: Restore selected backup into remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute xotours-db --remote --file="d1_backups/${{ inputs.backup_file }}"

      - name: Commit the safety backup made before this restore
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add d1_backups
          git diff --quiet && git diff --staged --quiet || (git commit -m "Pre-restore safety backup before restoring ${{ inputs.backup_file }}" && git pull --rebase origin main && git push)
